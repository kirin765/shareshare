# ShareShare coturn example.
# The shared secret is supplied on the command line by docker-compose
# (--static-auth-secret), never committed to this file.

listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
realm=shareshare

# Keep the relay range small and open exactly this range in the firewall.
min-port=49160
max-port=49200

# Do not expose the TURN CLI or allow relaying to local/private networks.
no-cli
no-multicast-peers
no-loopback-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Short-lived REST API credentials only. Adjust quotas to your capacity.
stale-nonce=600
user-quota=12
total-quota=1200
# Per-session ceiling, bytes per second. Remove for unthrottled lab tests.
max-bps=12500000

log-file=stdout
simple-log

# TLS requires certificate files; enable after mounting them.
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem
